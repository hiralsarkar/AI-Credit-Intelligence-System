name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install numpy pandas pytest ruff
      - name: Lint (errors only)
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Decision engine smoke run
        run: python 04_decision_engine/demo.py
